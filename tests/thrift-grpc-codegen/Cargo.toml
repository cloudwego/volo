[package]
name = "thrift-grpc-codegen"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
volo = { path = "../../volo" }
volo-grpc = { path = "../../volo-grpc", features = ["thrift"] }
volo-thrift = { path = "../../volo-thrift", features = ["ttstream"] }
pilota.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "io-std", "io-util"] }
futures.workspace = true
metainfo.workspace = true
sonic-rs.workspace = true

[build-dependencies]
volo-build = { path = "../../volo-build" }

[dev-dependencies]
tempfile.workspace = true
