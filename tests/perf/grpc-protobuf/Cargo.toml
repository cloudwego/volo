[package]
name = "grpc-protobuf-load"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
volo = { path = "../../../volo" }
volo-grpc = { path = "../../../volo-grpc" }
bytes = "1"
pilota = "0.13"
futures = "0.3"
http-body = "1"
motore = "0.4.1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
