[package]
name = "ttstream-codegen"
version = "0.0.0"
edition.workspace = true
publish = false
[features]
default = ["ttstream"]
ttstream = ["volo-thrift/ttstream"]
shmipc = ["volo-thrift/shmipc", "volo/shmipc"]
multiplex = ["volo-thrift/multiplex"]
[dependencies]
volo = { path = "../../volo" }
volo-thrift = { path = "../../volo-thrift" }
pilota.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
sonic-rs.workspace = true
metainfo.workspace = true
[build-dependencies]
volo-build = { path = "../../volo-build" }

[dev-dependencies]
shmipc.workspace = true
tempfile.workspace = true
